apiVersion: v1
kind: Pod   
metadata: 
  name: corso-pod-config 
  namespace: corso   
spec: 
  containers:
    - name: pod-test
      image: busybox 
      command: ["sh", "-c", "echo $MESSAGGIOLETTO - $TIPOLOGIA", "sleep 3600" ] 
      env: 
        - name: MESSAGGIOLETTO
          valueFrom:  
            configMapKeyRef:
              name: corso-config
              key: MESSAGGIO
        - name: TIPOLOGIA
          valueFrom: 
            configMapKeyRef: 
              name: corso-config
              key: MODO

