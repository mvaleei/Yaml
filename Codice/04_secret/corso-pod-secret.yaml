apiVersion: v1 
kind: Pod 
metadata: 
  name: corso-pod-secret 
  namespace: corso  
spec: 
  containers:
    - name: pod-test-container
      image: busybox
      command: ["sh","-c","echo utente: $UTENTELETTO - password: $PASSWORDLETTA && sleep 3600"]
      env:
        - name: UTENTELETTO 
          valueFrom: 
            secretKeyRef:
              name: secret-database
              key: UTENTE 
        - name: PASSWORDLETTA  
          valueFrom:
            secretKeyRef:
              name: secret-database
              key: PASSWORD
