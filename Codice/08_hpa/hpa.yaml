apiVersion: autoscaling/v2  
kind: HorizontalPodAutoscaler 
metadata:
  name: lez08isolation-hpa
  namespace: corso   

spec:
  scaleTargetRef:
    apiVersion: apps/v1 
    kind: Deployment 
    name: lez08-isolation   

  minReplicas: 1
  maxReplicas: 10 
  metrics:
  - type: Resource   
    resource:
      name: cpu
      target:
        type: Utilization 
        averageUtilization: 10  
  behavior:
    scaleDown:
     stabilizationWindowSeconds: 5

